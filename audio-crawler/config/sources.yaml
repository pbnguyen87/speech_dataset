# Danh sách nguồn crawl. Mỗi source: name (tên thư mục output) + type + tham số.
# delay_s: giây nghỉ giữa 2 lượt tải (lịch sự với server, mặc định 2.0)
# max_hours: cắt file dài hơn N giờ, chỉ lấy N giờ đầu (cần ffmpeg; mặc định tắt)
# Mỗi nguồn nhận mục tiêu dạng đơn / danh sách / file text — xem README "Khai báo nhiều link".
# File mẫu: *.example.txt trong thư mục này (đường dẫn *_file tính tương đối theo thư mục config/).

sources:
  # ---- Internet Archive: an toàn nhất, tải hàng loạt hợp pháp ----
  - name: uyen-uong-dao
    type: archive_org
    identifier: Uynngaowww.truyenaudio.net
    # identifiers_file: archive_items.example.txt   # hoặc/và file text, mỗi dòng 1 item

  # ---- Podcast RSS: mỗi episode một file mp3 ----
  # (điền RSS feed thật; tìm feed của podcast qua trang podcast hoặc podcastindex.org)
  # - name: podcast-vi-du
  #   type: rss
  #   url: https://feeds.example.com/ten-podcast.xml
  #   max_hours: 10          # vd. Truyện Audio Sưu Tầm có tập dài 30-40h
  #   urls_file: rss_feeds.example.txt   # hoặc/và file text, mỗi dòng 1 feed
  #   max_items: 100
  #   delay_s: 2.0

  # ---- YouTube channel/playlist (cần: pip install yt-dlp + ffmpeg) ----
  # - name: kenh-youtube-vi-du
  #   type: youtube
  #   url: https://www.youtube.com/@tenkenh/videos
  #   urls_file: youtube_links.txt   # hoặc/và file text, mỗi dòng 1 link (tương đối theo thư mục config/)
  #   max_items: 50
  #   audio_format: m4a
  #   delay_s: 5.0

