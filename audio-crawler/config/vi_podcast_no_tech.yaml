# Crawl podcast tiếng Việt >= 2 giờ TRỪ nhóm công nghệ/startup (1676 feed trong
# podcast_feeds_2h_no_tech.txt, sắp theo số giờ tăng dần để đa dạng kênh sớm; nhóm tech
# chạy riêng bằng vi_podcast_tech.yaml). Cùng tên source "vi-podcast" và dir "." như
# vi_podcast.yaml nên dùng chung raw/ + ledger: feed đã tải không tải lại.
# Chạy (máy GPU, xem docs/RUN_GPU.md mục 5 và 11):
#   python tools/crawl_and_process.py --config config/vi_podcast_no_tech.yaml \
#       --out $OUT/raw --workdir $OUT/work --pipeline-dir ../audio-pipeline \
#       --device cuda --stream --cleanup --no-s8
sources:
  - name: vi-podcast
    type: rss
    dir: .                                   # ghi thẳng raw/<feed>/..., không tạo raw/vi-podcast/
    urls_file: podcast_feeds_2h_no_tech.txt  # tương đối theo thư mục config/; dòng '#' bị bỏ qua
    max_hours: 10                            # tập dài hơn 10h chỉ lấy 10h đầu (kênh truyện gộp 30-40h/tập)
    delay_s: 1.0
